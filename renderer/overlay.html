<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'self'">
<style>
  html,body{margin:0;height:100%;background:transparent;overflow:hidden;user-select:none}
  body{display:flex;flex-direction:row-reverse;align-items:center;justify-content:flex-start;gap:10px;padding:0 4px;
    font-family:Inter,"Segoe UI",system-ui,Verdana,sans-serif}
  button{all:initial;box-sizing:border-box;flex:none;width:48px;height:48px;border-radius:999px;cursor:pointer;
    display:grid;place-items:center;background:#062847;border:1px solid #0F4A7A;color:#00CDFF;
    transition:box-shadow .15s,background .15s}
  button:hover{box-shadow:0 0 18px #00CDFFAA}
  svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  button.rec{background:linear-gradient(135deg,#00CDFF,#0083FF);border-color:#00CDFF;color:#001E36;
    box-shadow:0 0 18px #00CDFFAA;animation:halo 1.1s infinite}
  button.rec rect{fill:currentColor}
  button.busy{border-color:#00CDFF;color:#8FA7BF;cursor:wait;animation:fade 1s infinite}
  @keyframes halo{0%{box-shadow:0 0 0 0 #00A9FF55,0 0 18px #00CDFFAA}100%{box-shadow:0 0 0 14px #00A9FF00,0 0 18px #00CDFFAA}}
  @keyframes fade{50%{opacity:.5}}
  #tip{display:none;max-width:250px;font:600 13px/1.4 Inter,"Segoe UI",system-ui,Verdana,sans-serif;color:#00CDFF;
    background:#062847;border:1px solid #00CDFF;border-radius:18px;padding:6px 14px}
</style>
</head>
<body>
  <button id="btn" title="Bangla Voice Typing" aria-label="Record">
    <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>
  </button>
  <div id="tip"></div>
  <script src="overlay.js"></script>
</body>
</html>
